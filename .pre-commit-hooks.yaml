# For the pre-commit framework (https://pre-commit.com). In your .pre-commit-config.yaml:
#   - repo: https://github.com/azzs11/sprout
#     rev: <tag>
#     hooks:
#       - id: sprout-risk
#       - id: sprout-commit-msg   # optional; needs: pre-commit install -t prepare-commit-msg
# Run `sprout index` once in the repository; without an index the hook does nothing.
- id: sprout-risk
  name: sprout risk (git history check)
  description: Warns when staged changes undo a past fix or re-apply a reverted change.
  entry: sprout-hook pre-commit
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
- id: sprout-commit-msg
  name: sprout commit message draft
  description: Drafts the message for a plain git commit and asks why. Opt-in; may call your model.
  entry: sprout-hook prepare-commit-msg
  language: python
  always_run: true
  stages: [prepare-commit-msg]
