[project]
name = "sprout"
version = "0.1.0"
description = "Your codebase's memory: cited answers from git history (early stage)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Akchhya Singh", email = "akchhya.dev@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["git", "mcp", "rag", "code-search", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "platformdirs>=4.14.8",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pygit2>=1.21.0",
    "rich>=15.0.0",
    "tree-sitter>=0.26.1",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-c-sharp>=0.24.0",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-php>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.29.2",
]

[project.urls]
Homepage = "https://github.com/azzs11/sprout"
Repository = "https://github.com/azzs11/sprout"
Issues = "https://github.com/azzs11/sprout/issues"

[project.scripts]
sprout = "sprout.cli.app:main"

[project.optional-dependencies]
anthropic = [
    "anthropic>=2.12.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "anthropic>=2.12.0",
    "hypothesis>=6.170.17",
    "platformdirs>=4.14.8",
    "pre-commit>=4.7.0",
    "pydantic-settings>=2.16.3",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.6",
    "syrupy>=7.0.3",
]

# ----- tooling -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "PTH",
    "RET", "TC", "ARG", "S", "RUF", "D",
]
ignore = [
    "D105", "D107",  # magic methods and __init__ need no docstring
    "D203", "D213",  # pick one docstring style: summary on the first line
    "TC001", "TC002", "TC003",  # Typer and Pydantic need real imports at runtime
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "D", "ARG002", "E501"]
"bench/**" = ["S603", "S607", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["sprout", "bench", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "tests", "bench"]
strict = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
pythonpath = ["."]
testpaths = ["tests"]
xfail_strict = true
markers = ["models: downloads and runs real local models (opt-in, weekly CI)"]

[tool.coverage.run]
source = ["sprout"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "\\.\\.\\.$"]
